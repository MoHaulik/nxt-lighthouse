<style>

<script type="module">
import * as THREE from 'three';
import { mergeBufferGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { XRHandModelFactory } from 'three/addons/webxr/XRHandModelFactory.js';
THREE.ColorManagement.legacyMode = false;
await Promise.race([Promise.all(['400 40px "IM Fell English"', 'italic 400 40px "IM Fell English"', '400 40px "IM Fell English SC"', '400 40px "Courier Prime"'].map(f => document.fonts.load(f))), new Promise(r => setTimeout(r, 3000))]).catch(() => { });

// ═══════════════════════════ CONFIG ═══════════════════════════
// WORLD: metres. Your floor (the lantern-room floor) is y = 0, you start at the origin facing -z, out to sea. The sea is 28 m below.
const SIM = /[?&]sim/.test(location.search);
const V = THREE.Vector3, C = THREE.Color, Qn = THREE.Quaternion, MU = THREE.MathUtils;
const clamp = MU.clamp, lerp = MU.lerp, rand = (a, b) => a + Math.random() * (b - a), pick = a => a[Math.random() * a.length | 0];
const s01 = p => { p = clamp(p, 0, 1); return p * p * (3 - 2 * p); }, damp = (dt, tc) => 1 - Math.exp(-dt / tc);
const _v = new V(), _v2 = new V(), _v3 = new V(), _q = new Qn();
const TAU = Math.PI * 2;
const angDiff = (a, b) => { let d = (a - b) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; };
const CEN = new V(0, 0, -1.35);           // the lens, and the middle of the lantern room
const AP = 2.3, SEA = -28;               // octagon apothem; sea level
const DOOR_A = Math.PI / 4;              // the door is the south-east side (angle in xz from the centre, atan2(z, x))
const LENS = { r: .38, y0: 1.0, y1: 1.95, cy: 1.45 }, WICK = new V(0, 1.45, CEN.z + .4), FUNNEL = new V(.3, 1.04, CEN.z + .3), RING_R = .52;
const CRANK = new V(-.83, 1.02, -.72), CORD0 = new V(-.62, 1.42, .18), HOOK = new V(), CLEAT = new V(), BELL = new V(1.36, 1.62, -.95);
const SHELF = { x: 1.2, y: .9 };
const HARBOR = new V(210, -28, -70), EXIT = new V(330, -28, -60);
const CFG = { PINCH: { on: .02, gap: .02, cap: .035 }, HALF: .11, G: 9.81 };
const NIGHTS = [
  { sub: 'Calm seas. Mostly.', ships: 5, rocks: 6, every: 15, conc: 2, fog: 0, soot: 0, storm: 0, kraken: 0 },
  { sub: 'Fog.', ships: 6, rocks: 7, every: 14, conc: 3, fog: 1, soot: 1, storm: 0, kraken: 0 },
  { sub: 'A storm. Also, something else.', ships: 6, rocks: 7, every: 13, conc: 3, fog: .5, soot: 1, storm: 1, kraken: 1 },
];
const ROMAN = ['I', 'II', 'III'];

// ═══════════════════════════ CORE ═══════════════════════════
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(SIM ? 70 : 34, innerWidth / innerHeight, .02, 2000); scene.add(camera);
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0d0d0c, 1); renderer.xr.enabled = true; renderer.xr.setReferenceSpaceType('local-floor'); renderer.xr.setFramebufferScaleFactor(1.2);
renderer.outputEncoding = THREE.sRGBEncoding; renderer.toneMapping = THREE.NoToneMapping;
document.body.prepend(renderer.domElement);
const $ = id => document.getElementById(id);
let T = 0;
const OUT = '\n#include <encodings_fragment>\n';

// ═══════════════════════════ THE ENGRAVING: every surface hatched by its own light, line density held constant on screen ═══════════════════════════
const PAPER = new C('#ece6d6'), INKC = new C('#121212');
const SH = { uPaper: { value: PAPER }, uInk: { value: INKC }, uCam: { value: new V() }, uMoonD: { value: new V(-.5, .42, -.75).normalize() }, uLampP: { value: new V(CEN.x, LENS.cy, CEN.z) }, uCen: { value: new THREE.Vector2(CEN.x, CEN.z) },
  uYaw: { value: -Math.PI / 2 }, uHalf: { value: CFG.HALF }, uBeamI: { value: 0 }, uMoon: { value: .32 }, uDawn: { value: 0 }, uT: { value: 0 }, uFogZ: { value: -900 }, uFog: { value: 0 }, uFlame: { value: 0 }, uFlash: { value: 0 }, uHaze: { value: .35 }, uFlareP: { value: new THREE.Vector4(0, 0, 0, 0) } };
const GL_COMMON = `uniform vec3 uPaper,uInk,uCam,uMoonD,uLampP;uniform vec2 uCen;uniform float uYaw,uHalf,uBeamI,uMoon,uDawn,uT,uFogZ,uFog,uFlame,uFlash,uHaze;uniform vec4 uFlareP;
float h12(vec2 p){return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453);}
float vn(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h12(i),h12(i+vec2(1,0)),f.x),mix(h12(i+vec2(0,1)),h12(i+vec2(1,1)),f.x),f.y);}
float beamOne(float a,float y){return smoothstep(uHalf,uHalf*.35,abs(mod(a-y+3.14159265,6.2831853)-3.14159265));}
float beamAt(vec3 l){vec2 d=l.xz-uCen;float L=length(d);float a=atan(d.y,d.x);return uBeamI*max(beamOne(a,uYaw),beamOne(a,uYaw+3.14159265)*.55)*smoothstep(8.,22.,L)*smoothstep(420.,160.,L)*step(l.y,-3.)+uFlareP.w*smoothstep(320.,60.,length(l.xz-uFlareP.xz))*step(l.y,-3.);}
float fogAt(vec3 l){return uFog*smoothstep(uFogZ+10.,uFogZ-40.,l.z);}
float lineInk(float x,float w){float fw=fwidth(x);float f=abs(fract(x)-.5)*2.;float aa=min(fw*2.,.5);float l=1.-smoothstep(w-aa,w+aa,f);return mix(l,clamp(w,0.,1.),smoothstep(.2,.45,fw));}
float inkAt(vec3 l,vec3 a,vec3 b,float d,float F){float i1=lineInk(dot(l,a)*F,d*1.02-.02);float i2=lineInk(dot(l,b)*F*1.13,clamp((d-.45)*1.6,0.,1.));return max(max(i1,i2),step(.95,d));}
vec3 engrave(vec3 l,vec3 n,float tone){vec3 rf=abs(n.y)>.92?vec3(1.,0.,.3):vec3(0.,1.,0.);vec3 a=normalize(cross(n,rf));vec3 b=cross(n,a);float d=1.-clamp(tone,0.,1.);
  float lod=log2(max(length(uCam-l),.2)/.5);float fl=floor(lod);float F=230.*exp2(-fl);return mix(uPaper,uInk,mix(inkAt(l,a,b,d,F),inkAt(l,a,b,d,F*.5),lod-fl));}
vec3 hazeMix(vec3 c,vec3 l){float dist=length(uCam-l);float hz=uHaze*(1.-exp(-dist/260.))*(1.-uDawn*.5);float fg=fogAt(l);vec3 fc=mix(uInk*1.6,uPaper*.55,uDawn*.8+fg*.4+uFlash*.6);
  return mix(c,fc,clamp(hz+fg*.8*(.8+.2*h12(floor(gl_FragCoord.xy*.5)+floor(uT*8.))),0.,1.));}`;
const INK_VS = `#include <common>
#include <skinning_pars_vertex>
varying vec3 vW,vN;void main(){
#include <skinbase_vertex>
#include <beginnormal_vertex>
#include <skinnormal_vertex>
#include <begin_vertex>
#include <skinning_vertex>
vec4 w=modelMatrix*vec4(transformed,1.);vW=w.xyz;vN=normalize(mat3(modelMatrix)*objectNormal);gl_Position=projectionMatrix*viewMatrix*w;}`;
const INK_FS = `${GL_COMMON}uniform float uAlb,uEm,uMoonK,uLampK,uRim;varying vec3 vW,vN;
void main(){vec3 l=vW;vec3 n=normalize(vN);vec3 v=normalize(uCam-l);if(dot(n,v)<0.)n=-n;
  float moon=uMoon*uMoonK*(.3+.7*max(dot(n,uMoonD),0.));
  vec3 tl=uLampP-l;float dl=length(tl);float lamp=uLampK*uFlame*1.2/(1.+dl*dl*.8)*(.3+.7*max(dot(n,tl/dl),0.));
  vec2 tw=uCen-l.xz;float face=max(dot(n,normalize(vec3(tw.x,.2*length(tw),tw.y))),0.);float b=beamAt(l)*(.3+.9*face)*(1.-fogAt(l)*.85);
  float dawn=uDawn*(.55+.45*max(dot(n,normalize(vec3(.6,.6,-.4))),0.));
  float tone=uAlb*(moon+lamp+b*1.4+dawn+uFlash*1.2)+uEm;
  vec3 col=engrave(l,n,tone);col=mix(col,uInk,(1.-smoothstep(.08,.28,abs(dot(n,v))))*uRim);
  gl_FragColor=vec4(hazeMix(col,l),1.);${OUT}}`;
const MATS = {};
function ink(alb, o = {}) { const key = [alb, o.em || 0, o.moon ?? 1, o.lamp ?? 1, o.rim ?? 1, o.side || 0, o.skin || 0].join('|'); if (MATS[key]) return MATS[key];
  return MATS[key] = new THREE.ShaderMaterial({ uniforms: { ...SH, uAlb: { value: alb }, uEm: { value: o.em || 0 }, uMoonK: { value: o.moon ?? 1 }, uLampK: { value: o.lamp ?? 1 }, uRim: { value: o.rim ?? 1 } },
    vertexShader: INK_VS, fragmentShader: INK_FS, extensions: { derivatives: true }, side: o.side || THREE.FrontSide }); }
const LINES = {};
const lineMat = w => LINES[w] || (LINES[w] = new THREE.ShaderMaterial({ side: THREE.BackSide, uniforms: { uInk: SH.uInk, uW: { value: w } }, vertexShader: `uniform float uW;void main(){vec4 w=modelMatrix*vec4(position,1.);w.xyz+=normalize(mat3(modelMatrix)*normal)*uW;gl_Position=projectionMatrix*viewMatrix*w;}`, fragmentShader: `uniform vec3 uInk;void main(){gl_FragColor=vec4(uInk,1.);${OUT}}` }));
function mesh(geo, mat, parent, o = {}) { const m = new THREE.Mesh(geo, mat); if (o.p) m.position.set(...o.p); if (o.r) m.rotation.set(...o.r); if (o.s) m.scale.set(...o.s); (parent || scene).add(m); if (o.line) m.add(new THREE.Mesh(geo, lineMat(o.line))); return m; }
const grp = (parent, x = 0, y = 0, z = 0) => { const g = new THREE.Group(); g.position.set(x, y, z); (parent || scene).add(g); return g; };
const lathe = (pts, seg = 40) => new THREE.LatheGeometry(pts.map(p => new THREE.Vector2(p[0], p[1])), seg);
const flat = g => { g = g.toNonIndexed(); g.computeVertexNormals(); return g; };
function canvasTex(w, h, draw) { const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d'); draw(g, w, h); const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; t.anisotropy = 8; return t; }

// ═══════════════════════════ SKY: an engraved night, stars, a paper moon, cut-out clouds ═══════════════════════════
const sky = mesh(new THREE.SphereGeometry(1500, 48, 24), new THREE.ShaderMaterial({ uniforms: SH, side: THREE.BackSide, depthWrite: false, extensions: { derivatives: true },
  vertexShader: `varying vec3 vD;void main(){vD=normalize(position);vec4 w=modelMatrix*vec4(position,1.);gl_Position=projectionMatrix*viewMatrix*w;}`,
  fragmentShader: `${GL_COMMON}varying vec3 vD;void main(){vec3 d=normalize(vD);float el=d.y;
    float tone=.02+.14*exp(-max(el,0.)*7.)+.4*pow(max(dot(d,uMoonD),0.),40.)*uMoon*3.+uDawn*(.65+.3*exp(-max(el,0.)*3.))+uFlash*.9;
    float x=asin(clamp(el,-1.,1.))*420.+sin(atan(d.z,d.x)*6.)*.4;float ink=lineInk(x,(1.-clamp(tone,0.,1.))*1.03-.02);vec3 col=mix(uPaper,uInk,ink);
    float st=step(.9985,h12(floor(d.xz/(1.2-el)*700.)))*smoothstep(.05,.3,el)*(1.-uDawn)*(.6+.4*sin(uT*3.+d.x*900.));col=mix(col,uPaper,st);
    col=mix(col,mix(uInk*1.6,uPaper*.55,uDawn*.8+uFog*.4),smoothstep(.12,-.02,el)*.85);gl_FragColor=vec4(col,1.);${OUT}}` }));
sky.renderOrder = -10;
const moon = new THREE.Sprite(new THREE.SpriteMaterial({ map: canvasTex(256, 256, (g) => { g.fillStyle = '#ece6d6'; g.beginPath(); g.arc(128, 128, 120, 0, TAU); g.fill(); g.globalCompositeOperation = 'destination-out'; g.beginPath(); g.arc(178, 100, 110, 0, TAU); g.fill(); g.globalCompositeOperation = 'source-over';
  g.strokeStyle = '#121212'; g.lineWidth = 2; for (let y = 20; y < 236; y += 7) { g.beginPath(); g.moveTo(10, y); g.lineTo(78 + Math.sin(y) * 6, y); g.stroke(); } }), transparent: true, depthWrite: false }));
moon.scale.setScalar(70); scene.add(moon); moon.renderOrder = -9;
const sun = new THREE.Sprite(new THREE.SpriteMaterial({ map: canvasTex(256, 256, (g) => { g.fillStyle = '#ece6d6'; g.translate(128, 128); for (let k = 0; k < 18; k++) { g.rotate(TAU / 18); g.beginPath(); g.moveTo(-9, 62); g.lineTo(0, 124); g.lineTo(9, 62); g.fill(); } g.beginPath(); g.arc(0, 0, 66, 0, TAU); g.fill(); g.strokeStyle = '#121212'; g.lineWidth = 3; g.beginPath(); g.arc(0, 0, 57, 0, TAU); g.stroke(); }), transparent: true, depthWrite: false }));
sun.scale.setScalar(120); scene.add(sun); sun.visible = false;
const CLOUDS = []; { const tex = canvasTex(512, 256, (g, w) => { g.fillStyle = '#121212'; const blobs = [[120, 170, 70], [200, 140, 90], [300, 150, 80], [380, 175, 60], [250, 190, 70], [160, 195, 50]]; for (const [x, y, r] of blobs) { g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill(); }
    g.globalCompositeOperation = 'source-atop'; g.strokeStyle = '#ece6d6'; g.lineWidth = 2.4; for (let y = 40; y < 140; y += 6) { g.globalAlpha = 1 - (y - 40) / 100; g.beginPath(); g.moveTo(0, y); g.lineTo(w, y); g.stroke(); } g.globalAlpha = 1; g.lineWidth = 4; for (const [x, y, r] of blobs) { g.beginPath(); g.arc(x, y, r - 2, Math.PI * 1.05, Math.PI * 1.75); g.stroke(); } });
  for (let k = 0; k < 9; k++) { const s = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false, opacity: .95 })); s.userData = { a: rand(0, TAU), r: rand(700, 1000), y: rand(110, 260), sp: rand(.002, .005) }; s.scale.set(rand(260, 420), rand(130, 210), 1); scene.add(s); s.renderOrder = -8; CLOUDS.push(s); } }

// ═══════════════════════════ THE SEA, far below ═══════════════════════════
